<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array sum</title>
</head>
<body>
    <script>
        let a=[12,34,678,54,23];
        let sum=0;
        let mul=1;
        for (let i=0;i<a.length;i++){
             sum+=a[i];
             mul*=a[i];
        }
        document.write("Sum : ",sum,"<br>");
        document.write("Mul : ",mul);
    </script>
</body>
</html>
