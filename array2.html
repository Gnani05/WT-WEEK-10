<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Largest Element In Array</title>
</head>
<body>
    <script>
        let b=[12,45,897,65,2,342];
        let max=0;
        for (let i=0;i<b.length;i++){
            if(max<b[i]){
                max=b[i];
            }
        }
        document.write("Max: ",max);
    </script>
</body>
</html>
