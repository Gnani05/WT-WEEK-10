<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>element search in array</title>
</head>
<body>
    <script>
        let a=[23,45,65,43,78,98];
        let x=63;
        let f=false;
        for(let i=0;i<a.length;i++){
            if(x===a[i]){
                f=true;
                break;
            }
        }
        if(f){
            document.write("Element found");
        }
        else{
            document.write("Elemnt not found");
        }
    </script>
</body>
</html>
